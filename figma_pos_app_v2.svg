<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background: #090D16; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;" dir="rtl">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="ai-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1920" height="1080" fill="url(#bg-glow)"/>
  <circle cx="1500" cy="200" r="400" fill="#6366F1" opacity="0.12" filter="blur(80px)"/>
  <circle cx="300" cy="800" r="450" fill="#10B981" opacity="0.08" filter="blur(90px)"/>

  <!-- APP SHELL CONTAINER -->
  <g id="app-window" filter="url(#shadow-lg)">
    <!-- Main Window Background -->
    <rect x="60" y="40" width="1800" height="1000" rx="20" fill="#0D1322" stroke="#1E293B" stroke-width="2"/>
    
    <!-- Window Header Controls (Mac style) -->
    <g id="window-header">
      <rect x="60" y="40" width="1800" height="60" rx="20" fill="#151D30"/>
      <!-- Window Buttons -->
      <circle cx="1820" cy="70" r="7" fill="#EF4444"/>
      <circle cx="1798" cy="70" r="7" fill="#F59E0B"/>
      <circle cx="1776" cy="70" r="7" fill="#10B981"/>
      
      <!-- Top Search & ZATCA Status -->
      <text x="1600" y="76" fill="#F8FAFC" font-size="18" font-weight="700">نظام إدارة الفواتير والمبيعات المحاسبي V2</text>
      
      <!-- ZATCA Phase 2 Live Badge -->
      <g id="zatca-badge" transform="translate(180, 52)">
        <rect width="210" height="36" rx="18" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
        <circle cx="20" cy="18" r="5" fill="#10B981" filter="url(#glow-green)"/>
        <text x="115" y="23" fill="#34D399" font-size="13" font-weight="700" text-anchor="middle">ربط زكاة وهيئة الزكاة Phase 2 ✓</text>
      </g>
    </g>

    <!-- RIGHT SIDEBAR (Arabic RTL Navigation) -->
    <g id="sidebar" transform="translate(1620, 100)">
      <rect width="240" height="940" fill="#111827"/>
      
      <!-- Logo -->
      <g transform="translate(30, 30)">
        <rect width="45" height="45" rx="12" fill="url(#primary-grad)"/>
        <text x="22" y="30" fill="#FFF" font-size="22" font-weight="900" text-anchor="middle">POS</text>
        <text x="-65" y="28" fill="#F8FAFC" font-size="20" font-weight="800">النظام الذكي</text>
      </g>

      <!-- Navigation Items -->
      <!-- Active Item: Dashboard -->
      <g transform="translate(15, 110)">
        <rect width="210" height="50" rx="12" fill="url(#primary-grad)"/>
        <text x="160" y="32" fill="#FFFFFF" font-size="16" font-weight="700">📊 لوحة التحكم</text>
      </g>
      
      <!-- Item: POS Cashier -->
      <g transform="translate(15, 175)">
        <rect width="210" height="50" rx="12" fill="#1F2937" opacity="0.5"/>
        <text x="160" y="32" fill="#9CA3AF" font-size="15" font-weight="600">🖥️ نقطة البيع السريعة</text>
      </g>

      <!-- Item: ZATCA Invoices -->
      <g transform="translate(15, 240)">
        <rect width="210" height="50" rx="12" fill="#1F2937" opacity="0.5"/>
        <text x="160" y="32" fill="#9CA3AF" font-size="15" font-weight="600">🧾 الفواتير الإلكترونية</text>
      </g>

      <!-- Item: VAT Tax Return -->
      <g transform="translate(15, 305)">
        <rect width="210" height="50" rx="12" fill="#1F2937" opacity="0.5"/>
        <text x="160" y="32" fill="#9CA3AF" font-size="15" font-weight="600">🏛️ الإقرار الضريبي VAT</text>
      </g>

      <!-- Item: AI Chatbot -->
      <g transform="translate(15, 370)">
        <rect width="210" height="50" rx="12" fill="#311B92" stroke="#8B5CF6" stroke-width="1"/>
        <text x="155" y="32" fill="#C4B5FD" font-size="15" font-weight="700">🤖 المساعد الذكي AI</text>
      </g>
    </g>

    <!-- MAIN DASHBOARD CONTENT CANVAS -->
    <g id="main-content" transform="translate(80, 120)">
      
      <!-- TOP METRIC CARDS ROW -->
      <g id="metrics-row">
        <!-- Metric Card 1: Total Sales -->
        <g id="card-sales" transform="translate(1130, 0)">
          <rect width="380" height="150" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
          <text x="350" y="40" fill="#94A3B8" font-size="15" font-weight="600">إجمالي المبيعات (شامل الضريبة)</text>
          <text x="350" y="85" fill="#F8FAFC" font-size="32" font-weight="900">١٤٢,٨٥٠.٠٠ <tspan font-size="18" fill="#6366F1">ر.س</tspan></text>
          <rect x="20" y="100" width="100" height="30" rx="15" fill="#064E3B"/>
          <text x="70" y="120" fill="#34D399" font-size="13" font-weight="700" text-anchor="middle">↑ +٢٤.٥%</text>
        </g>

        <!-- Metric Card 2: VAT Tax Due -->
        <g id="card-vat" transform="translate(730, 0)">
          <rect width="380" height="150" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
          <text x="350" y="40" fill="#94A3B8" font-size="15" font-weight="600">ضريبة القيمة المضافة 15%</text>
          <text x="350" y="85" fill="#10B981" font-size="32" font-weight="900">٢١,٤٢٧.٥٠ <tspan font-size="18" fill="#34D399">ر.س</tspan></text>
          <rect x="20" y="100" width="130" height="30" rx="15" fill="#064E3B"/>
          <text x="85" y="120" fill="#34D399" font-size="13" font-weight="700" text-anchor="middle">جاهز للإقرار ✓</text>
        </g>

        <!-- Metric Card 3: ZATCA Phase 2 Signatures -->
        <g id="card-zatca-signed" transform="translate(330, 0)">
          <rect width="380" height="150" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
          <text x="350" y="40" fill="#94A3B8" font-size="15" font-weight="600">الفواتير المعتمدة من الهيئة</text>
          <text x="350" y="85" fill="#38BDF8" font-size="32" font-weight="900">١,٤٨٢ <tspan font-size="18" fill="#94A3B8">فاتورة</tspan></text>
          <rect x="20" y="100" width="140" height="30" rx="15" fill="#0C4A6E"/>
          <text x="90" y="120" fill="#38BDF8" font-size="13" font-weight="700" text-anchor="middle">تشفير ECDSA secp256r1</text>
        </g>

        <!-- Metric Card 4: Net Expenses -->
        <g id="card-expenses" transform="translate(0, 0)">
          <rect width="310" height="150" rx="16" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5"/>
          <text x="280" y="40" fill="#94A3B8" font-size="15" font-weight="600">المصروفات والتشغيل</text>
          <text x="280" y="85" fill="#F43F5E" font-size="32" font-weight="900">٣٤,٢٠٠ <tspan font-size="18" fill="#FDA4AF">ر.س</tspan></text>
          <text x="280" y="122" fill="#64748B" font-size="13">مضبوطة ومطابقة 100%</text>
        </g>
      </g>

      <!-- GRAPH & RECENT INVOICES ROW -->
      <g id="charts-row" transform="translate(0, 180)">
        
        <!-- Sales Chart Box -->
        <g id="sales-chart" transform="translate(530, 0)">
          <rect width="980" height="420" rx="16" fill="#111827" stroke="#1E293B" stroke-width="1.5"/>
          <text x="940" y="45" fill="#F8FAFC" font-size="18" font-weight="800">حركة المبيعات المباشرة والفواتير الإلكترونية</text>
          <text x="940" y="75" fill="#64748B" font-size="13">تحليل حي للمبيعات اليومية مقابل ضريبة القيمة المضافة ZATCA Phase 2</text>
          
          <!-- Grid Lines -->
          <line x1="50" y1="120" x2="930" y2="120" stroke="#1F2937" stroke-dasharray="5,5"/>
          <line x1="50" y1="190" x2="930" y2="190" stroke="#1F2937" stroke-dasharray="5,5"/>
          <line x1="50" y1="260" x2="930" y2="260" stroke="#1F2937" stroke-dasharray="5,5"/>
          <line x1="50" y1="330" x2="930" y2="330" stroke="#1F2937" stroke-dasharray="5,5"/>

          <!-- Curved Line Gradient -->
          <path d="M 60 330 Q 200 280, 350 200 T 650 150 T 920 100 L 920 370 L 60 370 Z" fill="url(#primary-grad)" opacity="0.15"/>
          <path d="M 60 330 Q 200 280, 350 200 T 650 150 T 920 100" fill="none" stroke="#6366F1" stroke-width="4"/>

          <!-- Pulse Nodes -->
          <circle cx="650" cy="150" r="7" fill="#8B5CF6" filter="url(#glow-purple)"/>
          <circle cx="920" cy="100" r="7" fill="#10B981" filter="url(#glow-green)"/>
        </g>

        <!-- Live Invoices Table Box -->
        <g id="invoices-table" transform="translate(0, 0)">
          <rect width="500" height="420" rx="16" fill="#111827" stroke="#1E293B" stroke-width="1.5"/>
          <text x="470" y="45" fill="#F8FAFC" font-size="18" font-weight="800">أحدث الفواتير المعتمدة</text>

          <!-- Table Header -->
          <rect x="20" y="70" width="460" height="40" rx="8" fill="#1E293B"/>
          <text x="450" y="95" fill="#94A3B8" font-size="13" font-weight="700">رقم الفاتورة</text>
          <text x="300" y="95" fill="#94A3B8" font-size="13" font-weight="700">العميل</text>
          <text x="160" y="95" fill="#94A3B8" font-size="13" font-weight="700">المبلغ</text>
          <text x="50" y="95" fill="#94A3B8" font-size="13" font-weight="700">الحالة</text>

          <!-- Row 1 -->
          <g transform="translate(20, 125)">
            <text x="430" y="25" fill="#F8FAFC" font-size="14" font-weight="600">INV-2026-089</text>
            <text x="280" y="25" fill="#CBD5E1" font-size="14">شركة الأمل</text>
            <text x="140" y="25" fill="#F8FAFC" font-size="14" font-weight="700">٤,٥٠٠ ر.س</text>
            <rect x="15" y="5" width="70" height="26" rx="13" fill="#064E3B"/>
            <text x="50" y="22" fill="#34D399" font-size="12" font-weight="700" text-anchor="middle">موقعة ✓</text>
          </g>

          <!-- Row 2 -->
          <g transform="translate(20, 175)">
            <text x="430" y="25" fill="#F8FAFC" font-size="14" font-weight="600">INV-2026-088</text>
            <text x="280" y="25" fill="#CBD5E1" font-size="14">مؤسسة الرياض</text>
            <text x="140" y="25" fill="#F8FAFC" font-size="14" font-weight="700">١,٢50 ر.س</text>
            <rect x="15" y="5" width="70" height="26" rx="13" fill="#064E3B"/>
            <text x="50" y="22" fill="#34D399" font-size="12" font-weight="700" text-anchor="middle">موقعة ✓</text>
          </g>

          <!-- Row 3 -->
          <g transform="translate(20, 225)">
            <text x="430" y="25" fill="#F8FAFC" font-size="14" font-weight="600">INV-2026-087</text>
            <text x="280" y="25" fill="#CBD5E1" font-size="14">مطعم النخيل</text>
            <text x="140" y="25" fill="#F8FAFC" font-size="14" font-weight="700">٨,٩٠٠ ر.س</text>
            <rect x="15" y="5" width="70" height="26" rx="13" fill="#064E3B"/>
            <text x="50" y="22" fill="#34D399" font-size="12" font-weight="700" text-anchor="middle">موقعة ✓</text>
          </g>
        </g>
      </g>
    </g>

    <!-- FLOATING POP-OUT LAYER: AI CHATBOT DRAWER (POP-OUT 3D FEATURE) -->
    <g id="ai-chatbot-drawer" transform="translate(100, 480)" filter="url(#shadow-lg)">
      <rect width="440" height="420" rx="20" fill="#0F172A" stroke="#8B5CF6" stroke-width="2"/>
      
      <!-- Drawer Header -->
      <rect width="440" height="60" rx="20" fill="#1E1B4B"/>
      <circle cx="410" cy="30" r="14" fill="url(#ai-glow)" filter="url(#glow-purple)"/>
      <text x="410" y="35" fill="#FFF" font-size="14" font-weight="900" text-anchor="middle">⚡</text>
      <text x="380" y="36" fill="#F8FAFC" font-size="16" font-weight="800">مساعد المبيعات والضرائب AI</text>
      
      <!-- Chat Message 1 (User) -->
      <g transform="translate(20, 80)">
        <rect width="320" height="45" rx="12" fill="#1E293B"/>
        <text x="300" y="28" fill="#E2E8F0" font-size="14">استخرج الإقرار الضريبي للربع الحالي متوافق مع زكاة</text>
      </g>

      <!-- Chat Message 2 (AI Response) -->
      <g transform="translate(80, 145)">
        <rect width="340" height="150" rx="16" fill="#2E1065" stroke="#7C3AED" stroke-width="1"/>
        <text x="320" y="30" fill="#A7F3D0" font-size="14" font-weight="700">تم تجهيز الإقرار الضريبي بنجاح! ✓</text>
        <text x="320" y="60" fill="#E2E8F0" font-size="13">• إجمالي الضريبة المستحقة: ٢١,٤٢٧.٥٠ ر.س</text>
        <text x="320" y="85" fill="#E2E8F0" font-size="13">• التشفير: ZATCA Phase 2 XML Validated</text>

        <!-- CTA Action Button inside AI Chat -->
        <rect x="40" y="102" width="260" height="36" rx="18" fill="url(#accent-green)"/>
        <text x="170" y="125" fill="#FFFFFF" font-size="14" font-weight="800" text-anchor="middle">تحميل ملخص XML وشريحة الضريبة ⬇</text>
      </g>
    </g>

  </g>
</svg>
