<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="نظام إدارة نقاط البيع والمخزون المتطور والفوترة الإلكترونية" />
    <meta property="og:title" content="البصمة الذكية" />
    <meta property="og:description" content="نظام إدارة نقاط البيع والمخزون المتطور والفوترة الإلكترونية" />
    <title>البصمة الذكية</title>
    <!-- Preconnect for Google Fonts (faster than @import inside CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Readex+Pro:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <!-- Splash: sleek enterprise loader -->
    <style>
      html, body { margin: 0; padding: 0; background: #0b0f17; }
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        font-family: 'Readex Pro', 'Tajawal', sans-serif; background: #0b0f17; z-index: 9999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash .logo-container {
        width: 76px; height: 76px; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 22px; display: flex; align-items: center; justify-content: center;
        margin-bottom: 24px;
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        position: relative;
      }
      #splash .logo-container::after {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.4), transparent, rgba(16, 185, 129, 0.2));
        z-index: -1;
      }
      #splash svg { width: 38px; height: 38px; stroke: #38bdf8; }
      #splash h1 { font-size: 22px; font-weight: 700; color: #f8fafc; margin: 0 0 6px; letter-spacing: -0.02em; }
      #splash .badge {
        font-size: 11px; font-weight: 600; color: #94a3b8; margin: 0 0 16px;
        letter-spacing: 0.08em; text-transform: uppercase; font-family: 'Plus Jakarta Sans', sans-serif;
      }
      #splash .spinner {
        width: 24px; height: 24px; border: 2.5px solid rgba(56, 189, 248, 0.15);
        border-top-color: #38bdf8; border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
  </head>
  <body>
    <!-- Splash shown until React mounts and hides it -->
    <div id="splash">
      <div class="logo-container">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/>
          <path d="M14 13.12c0 2.38 0 6.38-1 8.88"/>
          <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/>
          <path d="M2 12a10 10 0 0 1 18-6"/>
          <path d="M2 16h.01"/>
          <path d="M21.8 16c.2-2 .131-5.354 0-6"/>
          <path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/>
          <path d="M8.65 22c.21-.66.45-1.32.57-2"/>
          <path d="M9 6.8a6 6 0 0 1 9 5.2v2"/>
        </svg>
      </div>
      <h1>البصمة الذكية</h1>
      <div class="badge">SMART TOUCH POS & ATELIER ERP</div>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="src/main.jsx"></script>
    <script>
      // Hide splash once React has mounted (root gets children)
      const obs = new MutationObserver(() => {
        if (document.getElementById('root').childElementCount > 0) {
          setTimeout(() => {
            const s = document.getElementById('splash');
            if (s) { s.classList.add('hidden'); setTimeout(() => s.remove(), 400); }
          }, 150);
          obs.disconnect();
        }
      });
      obs.observe(document.getElementById('root'), { childList: true });
    </script>
  </body>
</html>
