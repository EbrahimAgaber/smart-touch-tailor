<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:* http://127.0.0.1:*;" />
    <title>البصمة الذكية</title>
    <!-- Preconnect for Google Fonts (faster than @import inside CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
    <!-- Splash: keep the page from being blank white during Electron load -->
    <style>
      html, body { margin: 0; padding: 0; background: #f8fafc; }
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        font-family: 'Tajawal', sans-serif; background: #f8fafc; z-index: 9999;
        transition: opacity 0.4s;
      }
      #splash .logo {
        width: 72px; height: 72px; background: linear-gradient(135deg, #3b82f6, #2563eb);
        border-radius: 20px; display: flex; align-items: center; justify-content: center;
        font-size: 36px; margin-bottom: 20px;
        box-shadow: 0 10px 30px rgba(37,99,235,0.25);
      }
      #splash h1 { font-size: 22px; font-weight: 900; color: #0f172a; margin: 0 0 8px; }
      #splash p  { font-size: 13px; color: #94a3b8; margin: 0; }
      #splash.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <!-- Splash shown until React mounts and hides it -->
    <div id="splash">
      <div class="logo">🏪</div>
      <h1>البصمة الذكية</h1>
      <p>جاري التحميل...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="src/main.jsx"></script>
    <script>
      // Hide splash once React has mounted (root gets children)
      const obs = new MutationObserver(() => {
        if (document.getElementById('root').childElementCount > 0) {
          setTimeout(() => {
            const s = document.getElementById('splash');
            if (s) { s.classList.add('hidden'); setTimeout(() => s.remove(), 400); }
          }, 150);
          obs.disconnect();
        }
      });
      obs.observe(document.getElementById('root'), { childList: true });
    </script>
  </body>
</html>
