<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الطلبات — البصمة الذكية</title>
<link rel="icon" href="Logo.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --brand:#3D52D5;--brand-dark:#2D3FAA;--brand-bg:rgba(61,82,213,.07);
  --green:#0DAF7A;--green-bg:rgba(13,175,122,.08);
  --amber:#F59E0B;--amber-bg:rgba(245,158,11,.08);
  --red:#EF4444;--red-bg:rgba(239,68,68,.08);
  --bg:#F4F6FB;--white:#fff;
  --border:#DDE3EF;
  --t1:#0F172A;--t2:#475569;--t3:#94A3B8;
  --sh-sm:0 4px 14px rgba(15,23,42,.09);
  --sh-md:0 8px 28px rgba(15,23,42,.11);
}
html{height:100%;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--t1);min-height:100%;-webkit-font-smoothing:antialiased;}
#lock-screen{position:fixed;inset:0;background:linear-gradient(135deg,#2B3DAE,#1D2F90,#0E1F72);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s,visibility .4s;}
#lock-screen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.lock-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:44px 40px;text-align:center;width:360px;backdrop-filter:blur(20px);}
.lock-logo{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:1.5rem;}
.lock-title{font-size:1.3rem;font-weight:900;color:#fff;margin-bottom:6px;}
.lock-sub{font-size:.85rem;color:rgba(255,255,255,.6);margin-bottom:28px;}
.lock-input{width:100%;padding:13px 16px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-family:'Cairo',sans-serif;font-size:.95rem;outline:none;text-align:center;letter-spacing:.15em;transition:border-color .2s,background .2s;margin-bottom:14px;}
.lock-input:focus{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.15);}
.lock-input::placeholder{color:rgba(255,255,255,.4);letter-spacing:.05em;}
.lock-btn{width:100%;padding:13px;border-radius:10px;background:#fff;color:var(--brand);font-family:'Cairo',sans-serif;font-size:.95rem;font-weight:800;border:none;cursor:pointer;transition:background .2s,transform .15s;}
.lock-btn:hover{background:#EEF2FF;transform:translateY(-1px);}
.lock-err{font-size:.8rem;color:#FCA5A5;margin-top:10px;opacity:0;transition:opacity .3s;}
.lock-err.show{opacity:1;}
#app{display:none;}
#app.visible{display:block;}
.admin-header{background:var(--white);border-bottom:1px solid var(--border);padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--sh-sm);}
.admin-brand{display:flex;align-items:center;gap:10px;}
.admin-logo{width:34px;height:34px;border-radius:8px;object-fit:cover;border:1px solid var(--border);}
.admin-title{font-size:1rem;font-weight:800;}
.admin-sub{font-size:.7rem;color:var(--t3);font-family:'Inter',sans-serif;}
.header-right{display:flex;align-items:center;gap:12px;}
.btn-sm{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;border:none;font-family:'Cairo',sans-serif;transition:all .2s;}
.btn-outline{background:var(--white);color:var(--t2);border:1px solid var(--border);}
.btn-outline:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-bg);}
.btn-brand{background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(61,82,213,.3);}
.btn-brand:hover{background:var(--brand-dark);transform:translateY(-1px);}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.btn-danger:hover{background:var(--red);color:#fff;}
.admin-main{max-width:1200px;margin:0 auto;padding:32px 40px;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:20px 22px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh-sm);}
.stat-icon{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;}
.stat-label{font-size:.75rem;color:var(--t3);font-weight:600;margin-bottom:3px;}
.stat-value{font-size:1.5rem;font-weight:900;font-family:'Inter',sans-serif;}
.toolbar{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:12px;margin-bottom:16px;box-shadow:var(--sh-sm);flex-wrap:wrap;}
.search-wrap{position:relative;flex:1;min-width:220px;}
.search-input{width:100%;padding:9px 36px 9px 14px;border-radius:8px;border:1px solid var(--border);font-family:'Cairo',sans-serif;font-size:.875rem;color:var(--t1);background:var(--bg);outline:none;transition:border-color .2s;}
.search-input:focus{border-color:var(--brand);}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3);}
.filter-select{padding:9px 12px;border-radius:8px;border:1px solid var(--border);font-family:'Cairo',sans-serif;font-size:.875rem;color:var(--t2);background:var(--bg);outline:none;cursor:pointer;}
.table-wrap{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--sh-sm);}
table{width:100%;border-collapse:collapse;}
thead{background:var(--bg);border-bottom:1px solid var(--border);}
thead th{padding:12px 18px;text-align:right;font-size:.76rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#FAFBFF;}
tbody td{padding:13px 18px;font-size:.875rem;vertical-align:middle;}
.lead-name{font-weight:700;color:var(--t1);}
.lead-phone{font-family:'Inter',sans-serif;color:var(--t2);direction:ltr;font-size:.83rem;}
.lead-date{font-size:.78rem;color:var(--t3);font-family:'Inter',sans-serif;}
.lead-index{font-size:.75rem;color:var(--t3);}
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:.72rem;font-weight:700;cursor:pointer;transition:all .2s;user-select:none;}
.status-new{background:var(--brand-bg);color:var(--brand);border:1px solid rgba(61,82,213,.2);}
.status-called{background:var(--amber-bg);color:#B45309;border:1px solid rgba(245,158,11,.2);}
.status-done{background:var(--green-bg);color:#0A9469;border:1px solid rgba(13,175,122,.2);}
.status-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;display:block;}
.actions{display:flex;align-items:center;gap:6px;}
.action-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--white);color:var(--t2);cursor:pointer;transition:all .15s;text-decoration:none;font-size:.85rem;}
.action-btn.call:hover{background:#DCFCE7;border-color:#0DAF7A;}
.action-btn.wa:hover{background:#DCFCE7;border-color:#25D366;}
.action-btn.copy:hover{background:var(--brand-bg);border-color:var(--brand);}
.action-btn.del:hover{background:var(--red-bg);border-color:var(--red);}
.empty-state{text-align:center;padding:80px 24px;color:var(--t3);}
.empty-icon{font-size:3rem;margin-bottom:16px;}
.empty-title{font-size:1.1rem;font-weight:700;color:var(--t2);margin-bottom:8px;}
.empty-sub{font-size:.875rem;line-height:1.7;}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--t1);color:#fff;padding:10px 22px;border-radius:99px;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;z-index:9000;transition:opacity .3s,transform .3s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(max-width:900px){.stats-row{grid-template-columns:repeat(2,1fr);}.admin-main{padding:20px;}.admin-header{padding:0 20px;}}
@media(max-width:600px){.stats-row{grid-template-columns:1fr 1fr;}.toolbar{flex-direction:column;align-items:stretch;}}
</style>
</head>
<body>
<div id="lock-screen">
  <div class="lock-card">
    <div class="lock-logo">🔒</div>
    <div class="lock-title">لوحة الطلبات</div>
    <div class="lock-sub">البصمة الذكية — للاستخدام الداخلي فقط</div>
    <input type="password" id="pw-input" class="lock-input" placeholder="كلمة المرور" autocomplete="off">
    <button class="lock-btn" id="pw-btn">دخول</button>
    <div class="lock-err" id="pw-err">كلمة المرور غير صحيحة</div>
  </div>
</div>
<div id="app">
  <header class="admin-header">
    <div class="admin-brand">
      <img src="Logo.ico" alt="البصمة الذكية" class="admin-logo">
      <div>
        <div class="admin-title">لوحة الطلبات</div>
        <div class="admin-sub">Smart Touch POS — Admin</div>
      </div>
    </div>
    <div class="header-right">
      <button class="btn-sm btn-outline" id="btn-export">⬇ تصدير CSV</button>
      <button class="btn-sm btn-danger" id="btn-clear">🗑 مسح الكل</button>
      <a href="index.html" class="btn-sm btn-brand">← الموقع</a>
    </div>
  </header>
  <main class="admin-main">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-icon" style="background:var(--brand-bg)">📋</div><div><div class="stat-label">إجمالي الطلبات</div><div class="stat-value" id="stat-total">0</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:var(--brand-bg)">🆕</div><div><div class="stat-label">جديد</div><div class="stat-value" id="stat-new" style="color:var(--brand)">0</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:var(--amber-bg)">📞</div><div><div class="stat-label">تم التواصل</div><div class="stat-value" id="stat-called" style="color:var(--amber)">0</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:var(--green-bg)">✅</div><div><div class="stat-label">مكتمل</div><div class="stat-value" id="stat-done" style="color:var(--green)">0</div></div></div>
    </div>
    <div class="toolbar">
      <div class="search-wrap">
        <input type="text" class="search-input" id="search-input" placeholder="ابحث بالاسم أو رقم الجوال...">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <select class="filter-select" id="filter-status">
        <option value="all">كل الحالات</option>
        <option value="new">جديد</option>
        <option value="called">تم التواصل</option>
        <option value="done">مكتمل</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>الاسم</th><th>رقم الجوال</th><th>تاريخ التسجيل</th><th>الحالة</th><th>إجراءات</th></tr></thead>
        <tbody id="leads-tbody"></tbody>
      </table>
      <div class="empty-state" id="empty-state" style="display:none">
        <div class="empty-icon">📭</div>
        <div class="empty-title">لا توجد طلبات بعد</div>
        <div class="empty-sub">عندما يسجل العملاء من الموقع ستظهر بياناتهم هنا</div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const PASS='pos2025';
const pwInput=document.getElementById('pw-input');
const pwBtn=document.getElementById('pw-btn');
const pwErr=document.getElementById('pw-err');
const lockScr=document.getElementById('lock-screen');
const appEl=document.getElementById('app');
if(sessionStorage.getItem('pos_admin')==='1')unlock();
function unlock(){lockScr.classList.add('hidden');appEl.classList.add('visible');sessionStorage.setItem('pos_admin','1');renderAll();}
pwBtn.addEventListener('click',attempt);
pwInput.addEventListener('keydown',e=>{if(e.key==='Enter')attempt();});
function attempt(){
  if(pwInput.value===PASS){unlock();}
  else{pwErr.classList.add('show');pwInput.value='';setTimeout(()=>{pwErr.classList.remove('show');},1800);}
}
function getLeads(){return JSON.parse(localStorage.getItem('pos_leads')||'[]');}
function saveLeads(arr){localStorage.setItem('pos_leads',JSON.stringify(arr));}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function renderAll(){
  const search=document.getElementById('search-input').value.toLowerCase();
  const filter=document.getElementById('filter-status').value;
  const leads=getLeads();
  document.getElementById('stat-total').textContent=leads.length;
  document.getElementById('stat-new').textContent=leads.filter(l=>l.status==='new').length;
  document.getElementById('stat-called').textContent=leads.filter(l=>l.status==='called').length;
  document.getElementById('stat-done').textContent=leads.filter(l=>l.status==='done').length;
  const filtered=leads.filter(l=>{
    const ms=l.name.toLowerCase().includes(search)||l.phone.includes(search);
    const mf=filter==='all'||l.status===filter;
    return ms&&mf;
  });
  const tbody=document.getElementById('leads-tbody');
  const empty=document.getElementById('empty-state');
  if(!filtered.length){tbody.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  const labels={new:'جديد',called:'تم التواصل',done:'مكتمل'};
  tbody.innerHTML=filtered.map((lead,i)=>`
    <tr>
      <td class="lead-index">${leads.indexOf(lead)+1}</td>
      <td><div class="lead-name">${esc(lead.name)}</div></td>
      <td><div class="lead-phone">${esc(lead.phone)}</div></td>
      <td><div class="lead-date">${esc(lead.date)}</div></td>
      <td><span class="status-badge status-${lead.status}" onclick="cycleStatus('${lead.id}')">${labels[lead.status]||'جديد'}</span></td>
      <td>
        <div class="actions">
          <a href="tel:${esc(lead.phone)}" class="action-btn call" title="اتصال" onclick="markCalled('${lead.id}')">📞</a>
          <a href="https://wa.me/966${lead.phone.replace(/^0/,'').replace(/\D/g,'')}" target="_blank" class="action-btn wa" title="واتساب" onclick="markCalled('${lead.id}')">💬</a>
          <button class="action-btn copy" title="نسخ الرقم" onclick="copyPhone('${esc(lead.phone)}')">📋</button>
          <button class="action-btn del" title="حذف" onclick="deleteLead('${lead.id}')">🗑</button>
        </div>
      </td>
    </tr>`).join('');
}
window.cycleStatus=function(id){
  const leads=getLeads();const lead=leads.find(l=>String(l.id)===String(id));if(!lead)return;
  const c={new:'called',called:'done',done:'new'};lead.status=c[lead.status]||'new';
  saveLeads(leads);renderAll();toast('تم تحديث الحالة ✓');
};
window.markCalled=function(id){
  const leads=getLeads();const lead=leads.find(l=>String(l.id)===String(id));
  if(lead&&lead.status==='new'){lead.status='called';saveLeads(leads);renderAll();}
};
window.copyPhone=function(p){navigator.clipboard.writeText(p).then(()=>toast('تم نسخ الرقم: '+p));};
window.deleteLead=function(id){
  if(!confirm('هل أنت متأكد من حذف هذا الطلب؟'))return;
  saveLeads(getLeads().filter(l=>String(l.id)!==String(id)));renderAll();toast('تم الحذف');
};
document.getElementById('btn-export').addEventListener('click',()=>{
  const leads=getLeads();if(!leads.length){toast('لا توجد بيانات');return;}
  const rows=[['#','الاسم','رقم الجوال','تاريخ التسجيل','الحالة']];
  leads.forEach((l,i)=>rows.push([i+1,l.name,l.phone,l.date,l.status]));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='leads_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(url);
  toast('تم تصدير '+leads.length+' سجل ✓');
});
document.getElementById('btn-clear').addEventListener('click',()=>{
  if(!confirm('سيتم حذف جميع الطلبات. هل أنت متأكد؟'))return;
  localStorage.removeItem('pos_leads');renderAll();toast('تم المسح');
});
document.getElementById('search-input').addEventListener('input',renderAll);
document.getElementById('filter-status').addEventListener('change',renderAll);
if(!getLeads().length){
  saveLeads([
    {id:Date.now()-5000,name:'أحمد الغامدي',phone:'0501234567',date:new Date().toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'}),status:'new'},
    {id:Date.now()-3000,name:'منى الشهراني',phone:'0559876543',date:new Date().toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'}),status:'called'},
    {id:Date.now()-1000,name:'فيصل العنزي',phone:'0541122334',date:new Date().toLocaleString('ar-SA',{dateStyle:'short',timeStyle:'short'}),status:'done'},
  ]);renderAll();
}
</script>
</body>
</html>
